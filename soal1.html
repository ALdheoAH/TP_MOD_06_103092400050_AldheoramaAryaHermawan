<!DOCTYPE html>
<html>
<head>
    <title>NIM_Soal1</title>
    <link type="text/css" rel="stylesheet" href="style1.css">
</head>
<body onload="">
    <form>
        <div class="form-group">
            <label>Nama</label>
            <input type="text" class="form-control" id="inputNama" readonly>
        </div>
        <div class="form-group">
            <label>NIM</label>
            <input type="text" class="form-control" id="inputNim" readonly>
        </div>
    </form>

    <script type="text/javascript">
    window.onload = function() {
        var nama = prompt("Masukkan nama kamu:");
        var nim = prompt("Masukkan NIM kamu:");

        if (nama !== null) {
            document.getElementById("inputNama").value = nama;
        }

        if (nim !== null) {
            document.getElementById("inputNim").value = nim;
        }
    };
</script>
</body>
</html>
